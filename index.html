<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Everything this app needs (scripts, styles, images, fonts) is bundled at
      build time — it never fetches anything at runtime. script-src 'self'
      blocks any injected/third-party script outright; style-src keeps
      'unsafe-inline' because React and recharts set inline style attributes
      extensively, and CSS injection is a much smaller risk than JS injection.
      (frame-ancestors/report-uri are omitted: browsers ignore them when set
      via <meta> rather than a real HTTP header, which GitHub Pages doesn't
      let us send.)
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none';"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retirement Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
